name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check committed JSON Schema is up to date
        run: |
          npm run shared:generate
          git diff --exit-code -- packages/shared/generated
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/inference
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Xcode project parses
        run: xcodebuild -list -project ios/StudentOS.xcodeproj
      - name: Build iOS app (simulator, no signing)
        run: |
          xcodebuild build \
            -project ios/StudentOS.xcodeproj -scheme StudentOS \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -20
